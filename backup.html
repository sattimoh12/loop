<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loop Backup</title><style>body{background:#101014;color:#e8e6e0;font-family:-apple-system,Helvetica,sans-serif;margin:0;padding:20px 16px 60px;line-height:1.5}h1{font-size:15px;letter-spacing:3px;color:#d4a24e}#w{font-size:13px;color:#d4a24e;border:1px solid #d4a24e;border-radius:8px;padding:10px;margin:12px 0}#s{font-size:12px;color:#8a8894;white-space:pre-wrap;font-family:ui-monospace,monospace;margin:12px 0}button{display:block;width:100%;padding:15px;margin:9px 0;background:#1a1a21;color:#e8e6e0;border:1px solid #3a3a44;border-radius:9px;font-size:15px}button.p{border-color:#d4a24e;color:#d4a24e}h2{font-size:11px;letter-spacing:2px;color:#8a8894;margin:26px 0 6px}textarea{width:100%;height:150px;background:#0c0c0e;color:#e8e6e0;border:1px solid #3a3a44;border-radius:8px;font-size:10px;font-family:ui-monospace,monospace;padding:8px}input[type=file]{font-size:13px;color:#8a8894;margin:8px 0}a{color:#6e9fc0}</style></head><body><h1>LOOP BACKUP</h1><div id="w">Checking storage...</div><div id="s"></div><h2>SAVE A BACKUP</h2><button class="p" id="b">RAW BACKUP - save everything</button><button id="c">Show as text to copy</button><h2>RESTORE</h2><input type="file" id="f" accept="application/json,.json,text/plain"><button id="i">IMPORT from file or text below</button><h2>RECOVER OLDER DATA</h2><button id="m">Merge stranded loop_v2 entries</button><textarea id="t" placeholder="Backup text appears here, or paste a backup to import"></textarea><p><a href="./">Back to The Loop</a></p><script>function snap(){var o={},i,k;for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k.indexOf("loop")===0){o[k]=localStorage.getItem(k);}}return o;}function payload(){return JSON.stringify({app:"loop",saved:new Date().toISOString(),data:snap()},null,1);}function stat(){var sa=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);document.getElementById("w").textContent=sa?"HOME SCREEN APP container - this is the one holding your entries.":"SAFARI BROWSER container. Data saved from the home screen icon will NOT appear here - open this page from that icon instead.";var o=snap(),k,t="",any=false;for(k in o){any=true;var n="?";try{var p=JSON.parse(o[k]);n=(p.entries||[]).length+" entries";}catch(e){n="unreadable";}t+=k+" - "+o[k].length+" chars - "+n+"\n";}document.getElementById("s").textContent=any?t:"No loop data visible in this container.";}document.getElementById("b").onclick=function(){var d=payload(),nm="loop-backup-"+new Date().toISOString().slice(0,10)+".json";try{var fl=new File([d],nm,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[fl]})){navigator.share({files:[fl],title:"Loop backup"});return;}}catch(e){}var u=URL.createObjectURL(new Blob([d],{type:"application/json"}));var a=document.createElement("a");a.href=u;a.download=nm;document.body.appendChild(a);a.click();};document.getElementById("c").onclick=function(){var t=document.getElementById("t");t.value=payload();t.focus();t.select();};document.getElementById("i").onclick=function(){var fl=document.getElementById("f").files[0],txt=document.getElementById("t").value;var go=function(s){var o;try{o=JSON.parse(s);}catch(e){alert("Not a valid backup file.");return;}var d=o&&o.data?o.data:o,k,n=0;for(k in d){n++;}if(!n){alert("No loop data in that backup.");return;}if(!confirm("Replace current data with this backup? "+n+" key(s) overwritten."))return;for(k in d){localStorage.setItem(k,d[k]);}alert("Imported. Reopen The Loop.");stat();};if(fl){var r=new FileReader();r.onload=function(){go(String(r.result));};r.readAsText(fl);}else if(txt.trim()){go(txt);}else{alert("Choose a file, or paste backup text in the box.");}};document.getElementById("m").onclick=function(){var a=localStorage.getItem("loop_v2");if(!a){alert("No loop_v2 data in this container.");return;}var A,B;try{A=JSON.parse(a);}catch(e){alert("loop_v2 unreadable.");return;}try{B=JSON.parse(localStorage.getItem("loop_v3")||"{}");}catch(e){B={};}var ae=A.entries||[],be=B.entries||[],seen={},out=[];be.concat(ae).forEach(function(e){var k=JSON.stringify(e);if(!seen[k]){seen[k]=1;out.push(e);}});if(!confirm("Merge "+ae.length+" older into "+be.length+" current? Result "+out.length+". Back up first."))return;B.entries=out;localStorage.setItem("loop_v3",JSON.stringify(B));alert("Merged. Reopen The Loop.");stat();};stat();</script></body></html>
